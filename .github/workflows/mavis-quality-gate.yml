name: Mavis Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      has_gradle: ${{ steps.detect.outputs.has_gradle }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_supabase: ${{ steps.detect.outputs.has_supabase }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          [ -f package.json ] && echo "has_node=true" >> "$GITHUB_OUTPUT" || echo "has_node=false" >> "$GITHUB_OUTPUT"
          [ -f gradlew ] && echo "has_gradle=true" >> "$GITHUB_OUTPUT" || echo "has_gradle=false" >> "$GITHUB_OUTPUT"
          [ -f Cargo.toml ] && echo "has_rust=true" >> "$GITHUB_OUTPUT" || echo "has_rust=false" >> "$GITHUB_OUTPUT"
          [ -d supabase ] && echo "has_supabase=true" >> "$GITHUB_OUTPUT" || echo "has_supabase=false" >> "$GITHUB_OUTPUT"

  node:
    name: Node checks
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm typecheck || true
            pnpm lint || true
            pnpm test || true
            pnpm build || true
          else
            npm ci
            npm run typecheck --if-present
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          fi

  gradle:
    name: Gradle checks
    needs: detect
    if: needs.detect.outputs.has_gradle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x ./gradlew
      - run: ./gradlew test
      - run: ./gradlew lint || true
      - run: ./gradlew assembleDebug || ./gradlew build

  rust:
    name: Rust checks
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
        continue-on-error: true