name: Diagnostic v2 release gates

# Intentionally manual until the owner explicitly authorizes running tests/builds.
on:
  workflow_dispatch:

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release secret scan
        run: bash tools/scan-release-secrets.sh
      - name: Production invariants
        run: bash tools/verify-production-guards.sh
      - name: Diagnostic unit and property tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug
      - name: Room migration verification and debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Cross-runtime parity
        run: bash tests/parity/ci-verify.sh
