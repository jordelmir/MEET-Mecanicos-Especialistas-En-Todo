name: Diagnostic v2 release gates

on:
  pull_request:
    paths:
      - "android/**"
      - "tests/diagnostics/**"
      - "tests/parity/**"
      - "tools/**"
      - ".github/workflows/diagnostic-v2-release-gates.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tests/diagnostics/**"
      - "tests/parity/**"
      - "tools/**"
      - ".github/workflows/diagnostic-v2-release-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency-graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency Review skipped because Dependency Graph is not enabled for this repository."
          fi
      - if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install TypeScript dependencies
        run: npm ci
      - name: Release secret scan
        run: bash tools/scan-release-secrets.sh
      - name: Git-history secret scan
        env:
          MEET_SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/scan-git-history-secrets.sh
      - name: Production invariants
        run: bash tools/verify-production-guards.sh
      - name: Diagnostic unit and property tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug
      - name: Room schema verification and debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Ephemeral release signing
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/meet-ci-release.jks" \
            -storepass "ci-release-only" \
            -keypass "ci-release-only" \
            -alias "meet-ci" \
            -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=MEET CI Ephemeral,OU=CI,O=Elysium Vanguard,C=CR"
      - name: Release R8 APK and AAB
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle_args=(
            -PKEYSTORE_PATH="${RUNNER_TEMP}/meet-ci-release.jks"
            -PKEYSTORE_PASSWORD=ci-release-only
            -PKEY_ALIAS=meet-ci
            -PKEY_PASSWORD=ci-release-only
            -PELYSIUM_SUPABASE_KEY_ROLE=ANON
            -PELYSIUM_SUPABASE_URL=
            -PELYSIUM_SUPABASE_KEY=
          )
          release_log="${RUNNER_TEMP}/meet-release-assembly.log"

          if ./gradlew :app:assembleRelease :app:bundleRelease "${gradle_args[@]}" 2>&1 | tee "$release_log"; then
            exit 0
          fi

          if ! grep -q "Execution failed for task ':app:packageRelease'" "$release_log" ||
             ! grep -q 'PackageAndroidArtifact\$IncrementalSplitterRunnable' "$release_log"; then
            echo "::error::Release assembly failed outside the reviewed transient packaging boundary."
            exit 1
          fi

          echo "::warning::Transient Android packaging failure detected; retrying packageRelease once."
          ./gradlew :app:packageRelease "${gradle_args[@]}" --stacktrace
          ./gradlew :app:bundleRelease "${gradle_args[@]}" --stacktrace
      - name: Built APK secret and string scan
        env:
          MEET_RELEASE_APK: android/app/build/outputs/apk/release/app-release.apk
        run: bash tools/scan-release-secrets.sh
      - name: Resolved release CycloneDX SBOM
        working-directory: android
        run: ./gradlew :app:generateReleaseSbom
      - name: APK/AAB integrity, hashes, SBOM and size budgets
        run: bash tools/vehicle-truth/verify-release-artifacts.sh
      - name: Cross-runtime parity
        run: bash tests/parity/ci-verify.sh
      - name: Archive verifiable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meet-release-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/vehicle-truth-release-manifest.json
            android/app/build/reports/sbom/meet-release.cdx.json
      - name: Attest release APK/AAB provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

  migration-conformance-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Create API 35 migration emulator
        shell: bash
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name meet-migration-api35 --package "system-images;android-35;google_apis;x86_64"
          nohup emulator -avd meet-migration-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/meet-emulator.log 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82
      - name: Execute adversarial Room migration conformance
        working-directory: android
        run: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.elysium369.meet.data.local.DiagnosticMigrationConformanceTest
