name: Diagnostic v2 release gates

on:
  pull_request:
    paths:
      - "android/**"
      - "tests/diagnostics/**"
      - "tests/parity/**"
      - "tools/**"
      - ".github/workflows/diagnostic-v2-release-gates.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tests/diagnostics/**"
      - "tests/parity/**"
      - "tools/**"
      - ".github/workflows/diagnostic-v2-release-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency-graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency Review skipped because Dependency Graph is not enabled for this repository."
          fi
      - if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install TypeScript dependencies
        run: npm ci
      - name: Release secret scan
        run: bash tools/scan-release-secrets.sh
      - name: Git-history secret scan
        env:
          MEET_SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/scan-git-history-secrets.sh
      - name: Production invariants
        run: bash tools/verify-production-guards.sh
      - name: Diagnostic unit and property tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug
      - name: Room migration verification and debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Ephemeral release signing
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/meet-ci-release.jks" \
            -storepass "ci-release-only" \
            -keypass "ci-release-only" \
            -alias "meet-ci" \
            -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=MEET CI Ephemeral,OU=CI,O=Elysium Vanguard,C=CR"
      - name: Release R8 assembly
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease
          -PKEYSTORE_PATH="${RUNNER_TEMP}/meet-ci-release.jks"
          -PKEYSTORE_PASSWORD=ci-release-only
          -PKEY_ALIAS=meet-ci
          -PKEY_PASSWORD=ci-release-only
          -PELYSIUM_SUPABASE_KEY_ROLE=ANON
          -PELYSIUM_SUPABASE_URL=
          -PELYSIUM_SUPABASE_KEY=
      - name: Built APK secret and string scan
        env:
          MEET_RELEASE_APK: android/app/build/outputs/apk/release/app-release.apk
        run: bash tools/scan-release-secrets.sh
      - name: Cross-runtime parity
        run: bash tests/parity/ci-verify.sh
