name: cross-runtime-parity

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  ts-parity:
    name: TypeScript parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install deps
        run: npm ci
      - name: Run TS tests
        run: npx vitest run
      - name: Verify fixture parity
        run: npx tsx tests/parity/hash-parity.ts tests/parity/fixtures/snapshot-p0230.json

  kotlin-parity:
    name: Kotlin parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run HashEngineParityTest
        run: ./gradlew :app:testDebugUnitTest --tests 'com.elysium369.meet.core.reports.HashEngineParityTest'
      - name: Upload parity artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-output
          path: app/build/reports/parity/
