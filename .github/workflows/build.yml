name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Android and web version agreement
        run: npm run check:versions
      - name: Web and shared contract tests
        run: npm test
      - name: Build web application
        run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Compile Android Compose UI instrumentation tests
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon
      - name: Run Compose UI tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
