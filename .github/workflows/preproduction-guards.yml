name: Pre-production guards

on:
  pull_request:
  push:
    branches: [main]

jobs:
  production-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fail-closed production invariants
        run: bash tools/verify-production-guards.sh
